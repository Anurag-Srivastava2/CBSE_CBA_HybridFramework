[pytest]
addopts = -v -s -m "not nightly" --html=reports/report.html --self-contained-html
render_collapsed =
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    rtm: test case sourced from the CBSE requirements traceability workbook
    ui: browser-based user-interface test
    smoke: small critical-path confidence test
    e2e: multi-step end-to-end business workflow
    contract: workflow or business-rule contract test
    manual: requires manual verification or unavailable external integration
    performance: performance or concurrency test
    cross_browser: browser or responsive-device compatibility test
    flaky: test is marked for automatic retry on failure via pytest-rerunfailures
    serial: mutates shared environment state and must not run in parallel with other tests
    nightly: asserts AI/model verdicts rather than application logic, so it is excluded from the default run and executed on a schedule instead
